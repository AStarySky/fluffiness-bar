const F = DATA.frames, M = DATA.meta;
const $ = id => document.getElementById(id);
const box = $('box'), sa = $('sa'), sb = $('sb'), g0 = $('g0'), sl = $('sl');
const BIG = f => `data/big/${f.i}.jpg`, TH = f => `data/th/${f.i}.jpg`;
let cur = 0, front = sa, back = sb, playing = null, pending = -1;

$('sub').textContent = `${M.name}（mid ${M.mid}） · ${M.d0} ~ ${M.d1} · ${M.n} 帧`;
$('cnt').textContent = `全部 ${F.length} 帧（按蓬松度排序）`;

/* ---------- 图片：先解码再交叉淡入，网络慢也不会闪 ---------- */
const cache = new Map();
function preload(k){
  let im = cache.get(k);
  if (!im){ im = new Image(); im.decoding = 'async'; im.src = BIG(F[k]); cache.set(k, im); }
  return im;
}
function show(k, instant){
  k = Math.max(0, Math.min(F.length - 1, k));
  const f = F[k], im = preload(k);
  const apply = () => {
    if (back.getAttribute('src') !== im.src) back.src = im.src;
    if (instant){
      back.style.transition = 'none'; front.style.transition = 'none';
      back.style.opacity = 1; front.style.opacity = 0;
      back.getBoundingClientRect();
      requestAnimationFrame(() => { back.style.transition = ''; front.style.transition = ''; });
    } else {
      back.style.opacity = 1; front.style.opacity = 0;
    }
    const t = front; front = back; back = t;
  };
  if (im.complete && im.naturalWidth){ pending = -1; apply(); }
  else {
    pending = k;
    const go = () => { if (im.complete && im.naturalWidth && pending === k){ pending = -1; apply(); } };
    im.addEventListener('load', go, {once: true});
    im.addEventListener('error', go, {once: true});
  }
  cur = k;
  $('hv').textContent = f.hair.toFixed(2);
  $('tag').innerHTML = `<b>${f.date}</b>　`;
  $('tag').appendChild(document.createTextNode(f.title));
  $('kv').innerHTML =
    `<i>发布日期</i><b>${f.date}</b>` +
    `<i>头发蓬松度</i><b>${f.hair.toFixed(2)} / 5</b>` +
    `<i>事件分量</i><b>${f.A == null ? '—' : f.A.toFixed(2)}</b>` +
    `<i>措辞强度</i><b>${f.W == null ? '—' : f.W.toFixed(2)}</b>` +
    `<i>原视频</i><b><a href="https://www.bilibili.com/video/${f.bvid}" target="_blank"
       rel="noopener">${f.bvid} ↗</a></b>`;
  sl.value = f.hair;
  sl.style.setProperty('--p', ((f.hair - M.lo) / (M.hi - M.lo) * 100).toFixed(2) + '%');
  $('pos').textContent = `第 ${k + 1} / ${F.length} 帧`;
  const all = document.querySelectorAll('#strip img');
  all.forEach((o, i) => o.classList.toggle('on', i === k));
  if (all[k]) all[k].scrollIntoView({block: 'nearest'});
  moveMarker(k);
}
function nearest(v){
  let bi = 0, bd = Infinity;
  F.forEach((f, i) => { const d = Math.abs(f.hair - v); if (d < bd){ bd = d; bi = i; } });
  return bi;
}

/* ---------- 控件 ---------- */
sl.min = M.lo; sl.max = M.hi;
sl.addEventListener('input', () => { stop(); show(nearest(+sl.value)); });
$('ghost').onclick = () => {
  const on = $('ghost').getAttribute('aria-pressed') !== 'true';
  $('ghost').setAttribute('aria-pressed', on);
  box.classList.toggle('ghost', on);
};
document.querySelectorAll('#view button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#view button').forEach(x =>
    x.setAttribute('aria-pressed', x === b));
  box.classList.toggle('head', b.dataset.v === 'head');
});
function stop(){
  if (!playing) return;
  clearInterval(playing); playing = null;
  $('play').textContent = '▶ 自动播放'; $('play').setAttribute('aria-pressed', 'false');
}
$('play').onclick = () => {
  if (playing){ stop(); return; }
  $('play').textContent = '❚❚ 暂停'; $('play').setAttribute('aria-pressed', 'true');
  playing = setInterval(() => show(cur >= F.length - 1 ? 0 : cur + 1), 175);
};
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.target !== sl) return;
  if (e.key === 'ArrowRight'){ stop(); show(cur + 1); e.preventDefault(); }
  else if (e.key === 'ArrowLeft'){ stop(); show(cur - 1); e.preventDefault(); }
  else if (e.key === ' '){ $('play').click(); e.preventDefault(); }
});

/* ---------- 胶片 ---------- */
const st = $('strip');
F.forEach((f, i) => {
  const im = document.createElement('img');
  im.src = TH(f); im.loading = 'lazy'; im.decoding = 'async';
  im.alt = `蓬松度 ${f.hair.toFixed(2)} · ${f.title}`;
  im.title = `${f.hair.toFixed(2)} · ${f.date} · ${f.title}`;
  im.onclick = () => { stop(); show(i); };
  st.appendChild(im);
});

/* ---------- 走势小图 ---------- */
const W = 336, Hh = 100, P = 13, PT = 24, PB = 12;
const TS = F.map(f => new Date(f.date).getTime());
const t0 = Math.min(...TS), t1 = Math.max(...TS);
const CX = t => Math.max(P, Math.min(W - P, P + (t - t0) / (t1 - t0) * (W - P * 2)));
const CY = v => Hh - PB - (v - M.lo) / (M.hi - M.lo) * (Hh - PB - PT);
function drawChart(){
  const sv = $('chart');
  sv.setAttribute('viewBox', `0 0 ${W} ${Hh}`);
  let s = '';
  [2.5, 3.5, 4.5].forEach(v => {
    s += `<line x1="${P}" y1="${CY(v).toFixed(1)}" x2="${W - P}" y2="${CY(v).toFixed(1)}"
      stroke="var(--grid)"/>`;
  });
  // 折线得按**日期**串，F 本身是按蓬松度升序排的
  const pts = F.map((f, k) => ({t: TS[k], k: k, x: CX(TS[k]), y: CY(f.hair)}))
               .sort((a, b) => a.t - b.t || a.k - b.k)
               .map(p => [p.x, p.y]);
  s += `<polyline points="${pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ')}"
    fill="none" stroke="var(--blue)" stroke-width="1.6" stroke-opacity=".4"/>`;
  pts.forEach(p => {
    s += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.5"
      fill="var(--blue)" fill-opacity=".55"/>`;
  });
  s += `<circle id="mk" cx="0" cy="0" r="6" fill="none" stroke="var(--orange)"
    stroke-width="2.5"/>`;
  s += `<text x="0" y="9" fill="var(--muted)" font-size="11">蓬松度随日期（一点一帧）</text>`;
  sv.innerHTML = s;
}
function moveMarker(k){
  const mk = $('mk');
  if (!mk) return;
  mk.setAttribute('cx', CX(new Date(F[k].date).getTime()).toFixed(1));
  mk.setAttribute('cy', CY(F[k].hair).toFixed(1));
}

/* ---------- 尺寸 & 启动 ---------- */
function size(){
  const s = $('stage');
  const w = Math.min(s.clientWidth - 28, (s.clientHeight - 28) * 660 / 560, 880);
  box.style.width = Math.max(200, w) + 'px';
  box.style.height = Math.max(170, w * 560 / 660) + 'px';
}
addEventListener('resize', size);
const HS = new URLSearchParams(location.hash.slice(1));
if (HS.get('ghost') === '1'){ box.classList.add('ghost');
  $('ghost').setAttribute('aria-pressed', 'true'); }
if (HS.get('view') === 'head'){ box.classList.add('head');
  document.querySelectorAll('#view button').forEach(x =>
    x.setAttribute('aria-pressed', x.dataset.v === 'head')); }
size();
g0.src = BIG(F[0]);
drawChart();
show(HS.get('i') ? +HS.get('i') : Math.floor(F.length / 2), true);
setTimeout(() => F.forEach((f, i) => preload(i)), 350);   // 后台把所有帧拉下来
</script>
